name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: node ./node_modules/semantic-release/bin/semantic-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Deploy waits for this workflow; a failed release blocks it, so say so
      # clearly (GitHub notifies the pusher about failed workflow runs).
      - name: Report release failure
        if: failure()
        run: echo "::error title=Release failed::Release/tagging failed for ${GITHUB_SHA}. Production deploy is blocked until this workflow succeeds. Fix the release and re-run it."
