name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blocked:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report CI failure
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "::error title=Release blocked::Release blocked because CI ${CONCLUSION} for ${SHA}. Fix CI (${CI_URL}) and push the fix to main."
          exit 1

  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Save CI-tested commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir release-target
          printf '%s\n' "$SHA" > release-target/sha
      - uses: actions/upload-artifact@v4
        with:
          name: release-target
          path: release-target/sha
          retention-days: 1
      - run: node ./node_modules/semantic-release/bin/semantic-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Deploy waits for this workflow; a failed release blocks it, so say so
      # clearly (GitHub notifies the pusher about failed workflow runs).
      - name: Report release failure
        if: failure()
        run: echo "::error title=Release failed::Release/tagging failed for ${GITHUB_SHA}. Production deploy is blocked until this workflow succeeds. Fix the release and re-run it."
