name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The same entry point as the pre-commit hook (scripts/verify.ts).
      - run: bun run verify

  # Kept only because "web" is a required status check in the protect-main
  # ruleset. `verify` runs all of this and more; drop this job once "web" is
  # removed from the ruleset.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter web check-types
      - run: bun run --filter web lint
      - run: bun run check:plan-boundary
