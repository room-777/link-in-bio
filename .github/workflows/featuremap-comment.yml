name: Feature map comment

# Comments on fork PRs after "Feature map" finishes. This runs the default
# branch's copy of this file with a write token, so it never checks out or
# runs PR code: it reads only the summary artifact, treats it as untrusted
# text, and comments only when the PR's head is the commit that run tested.
on:
  workflow_run:
    workflows: [Feature map]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ci
            package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: featuremap-summary
          path: summary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post or update the feature-map comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PR_FILE: summary/pr.json
          SUMMARY_FILE: summary/summary.json
        run: bun scripts/ci/featuremap-comment.ts
