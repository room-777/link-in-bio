name: Deploy

# Deploys production after the Release workflow finishes successfully on main.
# Database migrations are NOT run here; apply them explicitly before merging
# schema changes (see README "Apply migrations").
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Write production env files
        env:
          WEB_ENV_PRODUCTION: ${{ secrets.WEB_ENV_PRODUCTION }}
          SERVER_ENV_PRODUCTION: ${{ secrets.SERVER_ENV_PRODUCTION }}
        run: |
          umask 077
          test -n "$WEB_ENV_PRODUCTION" || { echo "WEB_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          test -n "$SERVER_ENV_PRODUCTION" || { echo "SERVER_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          printf '%s\n' "$WEB_ENV_PRODUCTION" > apps/web/.env.production
          printf '%s\n' "$SERVER_ENV_PRODUCTION" > apps/server/.env.production
      - name: Deploy (alchemy, stage production)
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_TELEMETRY_DISABLED: "1"
        run: bun run deploy:production
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://grabbin.me/
          curl -fsS -o /dev/null https://grabbin.me/sitemap.xml
      - name: Remove env files
        if: always()
        run: rm -f apps/web/.env.production apps/server/.env.production
