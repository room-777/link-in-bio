name: Deploy

# Deploys the CI-tested commit after Release succeeds on main. Manual deploys
# use the current main commit and run both CI checks because they bypass CI and
# Release.
# Database migrations are NOT run here. Apply schema migrations before merging.
# JSONB shape migrations may require the compatible app version to deploy first.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  manual-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify

  manual-auth-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grabbin_smoke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Sign in, then check the session
        working-directory: apps/server
        env:
          AUTH_SMOKE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grabbin_smoke_test
        run: bun test tests/integration/auth-session-smoke-postgres.test.ts

  manual-featuremap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Feature map
        env:
          FEATUREMAP_HEADLESS: "1"
        run: bun run featuremap

  blocked:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fail because Release did not succeed
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "::error title=Deploy blocked::Deploy blocked: Release failed for ${SHA} (conclusion: ${CONCLUSION}). Fix Release (${RELEASE_URL}) and re-run it; Deploy starts after it succeeds."
          exit 1

  deploy:
    needs: [manual-verify, manual-auth-smoke, manual-featuremap]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        needs.manual-verify.result == 'success' &&
        needs.manual-auth-smoke.result == 'success' &&
        needs.manual-featuremap.result == 'success') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    # One production deploy runs at a time; each run deploys its checked commit.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download CI-tested commit
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-target
          path: release-target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read CI-tested commit
        id: release-target
        if: github.event_name == 'workflow_run'
        run: |
          sha="$(cat release-target/sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid CI-tested commit SHA" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-target.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Write production env files
        env:
          WEB_ENV_PRODUCTION: ${{ secrets.WEB_ENV_PRODUCTION }}
          SERVER_ENV_PRODUCTION: ${{ secrets.SERVER_ENV_PRODUCTION }}
        run: |
          umask 077
          test -n "$WEB_ENV_PRODUCTION" || { echo "WEB_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          test -n "$SERVER_ENV_PRODUCTION" || { echo "SERVER_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          printf '%s\n' "$WEB_ENV_PRODUCTION" > apps/web/.env.production
          printf '%s\n' "$SERVER_ENV_PRODUCTION" > apps/server/.env.production
      - name: Deploy (alchemy, stage production)
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_TELEMETRY_DISABLED: "1"
        run: bun run deploy:production -- --yes --detect-drift
      # Unauthenticated reads only. Retries cover edge propagation; a page or
      # API that still errors after that fails this run.
      - name: Production health check
        run: |
          check() {
            url="$1"; expect="$2"
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS -o /tmp/health-body -w '%{http_code}' --max-time 15 "$url" || echo 000)
              if [ "$status" = "200" ] && { [ -z "$expect" ] || grep -q "$expect" /tmp/health-body; }; then
                echo "ok $url"
                return 0
              fi
              echo "attempt $attempt: $url returned $status" >&2
              sleep 10
            done
            echo "::error::Health check failed: $url" >&2
            return 1
          }
          check https://grabbin.me/ "<html"
          check https://grabbin.me/sitemap.xml "<urlset"
          check https://api.grabbin.me/ '"OK"'
          # Session check without a cookie: 200 with null, never a server error.
          check https://api.grabbin.me/auth/get-session "^null"
      - name: Remove env files
        if: always()
        run: rm -f apps/web/.env.production apps/server/.env.production
