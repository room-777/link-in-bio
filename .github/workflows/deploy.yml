name: Deploy

# Deploys production only after the Release workflow succeeds on main (or on
# a manual run). If Release fails or is cancelled, the `blocked` job fails with
# an error annotation so the blocked deploy is never silent (GitHub notifies
# about the failed run). `bun run verify` runs again before deploying.
# Database migrations are NOT run here; apply them explicitly before merging
# schema changes (see README "Apply migrations").
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fail because Release did not succeed
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "::error title=Deploy blocked::Deploy blocked: Release failed for ${SHA} (conclusion: ${CONCLUSION}). Fix Release (${RELEASE_URL}) and re-run it; Deploy starts after it succeeds."
          exit 1

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # One production deploy at a time. A newer run waits and replaces any older
    # one still waiting, so main's latest commit is what ends up deployed.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Gate: the same checks as the pre-commit hook and CI, on this commit.
      - name: Verify before deploy
        run: bun run verify
      - name: Write production env files
        env:
          WEB_ENV_PRODUCTION: ${{ secrets.WEB_ENV_PRODUCTION }}
          SERVER_ENV_PRODUCTION: ${{ secrets.SERVER_ENV_PRODUCTION }}
        run: |
          umask 077
          test -n "$WEB_ENV_PRODUCTION" || { echo "WEB_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          test -n "$SERVER_ENV_PRODUCTION" || { echo "SERVER_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          printf '%s\n' "$WEB_ENV_PRODUCTION" > apps/web/.env.production
          printf '%s\n' "$SERVER_ENV_PRODUCTION" > apps/server/.env.production
      - name: Deploy (alchemy, stage production)
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_TELEMETRY_DISABLED: "1"
        run: bun run deploy:production -- --yes
      # Unauthenticated reads only. Retries cover edge propagation; a page or
      # API that still errors after that fails this run.
      - name: Production health check
        run: |
          check() {
            url="$1"; expect="$2"
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS -o /tmp/health-body -w '%{http_code}' --max-time 15 "$url" || echo 000)
              if [ "$status" = "200" ] && { [ -z "$expect" ] || grep -q "$expect" /tmp/health-body; }; then
                echo "ok $url"
                return 0
              fi
              echo "attempt $attempt: $url returned $status" >&2
              sleep 10
            done
            echo "::error::Health check failed: $url" >&2
            return 1
          }
          check https://grabbin.me/ "<html"
          check https://grabbin.me/sitemap.xml "<urlset"
          check https://api.grabbin.me/ '"OK"'
          # Session check without a cookie: 200 with null, never a server error.
          check https://api.grabbin.me/auth/get-session "^null"
      - name: Remove env files
        if: always()
        run: rm -f apps/web/.env.production apps/server/.env.production
