name: Deploy

# Deploys production on every push to main (every merged PR), independent of
# the Release workflow: a release/tagging failure must never skip a deploy.
# The same checks as CI (`bun run verify`) run first, so a broken main is not
# deployed. Database migrations are NOT run here; apply them explicitly before
# merging schema changes (see README "Apply migrations").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time. A newer push waits for the running deploy
# and replaces any older one still waiting, so main's latest commit always
# ends up deployed and two deploys never run at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Gate: the same checks as the pre-commit hook and CI, on this commit.
      - name: Verify before deploy
        run: bun run verify
      - name: Write production env files
        env:
          WEB_ENV_PRODUCTION: ${{ secrets.WEB_ENV_PRODUCTION }}
          SERVER_ENV_PRODUCTION: ${{ secrets.SERVER_ENV_PRODUCTION }}
        run: |
          umask 077
          test -n "$WEB_ENV_PRODUCTION" || { echo "WEB_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          test -n "$SERVER_ENV_PRODUCTION" || { echo "SERVER_ENV_PRODUCTION secret is missing" >&2; exit 1; }
          printf '%s\n' "$WEB_ENV_PRODUCTION" > apps/web/.env.production
          printf '%s\n' "$SERVER_ENV_PRODUCTION" > apps/server/.env.production
      - name: Deploy (alchemy, stage production)
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_TELEMETRY_DISABLED: "1"
        run: bun run deploy:production -- --yes
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://grabbin.me/
          curl -fsS -o /dev/null https://grabbin.me/sitemap.xml
      - name: Remove env files
        if: always()
        run: rm -f apps/web/.env.production apps/server/.env.production
